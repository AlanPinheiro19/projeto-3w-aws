# Stack local do projeto 3W Offshore Events
# Servicos:
#   glue-local         - AWS Glue 4.0 com Spark + PySpark (ETL scripts)
#   jupyter            - Jupyter Notebook para EDA (http://localhost:8888)
#   postgres           - PostgreSQL 15 (localhost:5432) - backend do projeto e do Airflow
#   pgadmin            - Interface web PostgreSQL (http://localhost:5050)
#   minio              - Emulador S3 local (http://localhost:9000 / console: 9001)
#   mc-init            - Inicializa buckets no MinIO (efemero)
#   airflow-init       - Inicializa banco do Airflow (efemero)
#   airflow-webserver  - UI do Airflow (http://localhost:8080)  admin/admin
#   airflow-scheduler  - Agendador de DAGs
#   streamlit          - Dashboard interativo (http://localhost:8501)
#
# Inicio rapido:
#   cp .env.example .env
#   docker compose up airflow-init        # aguardar "exited 0"
#   docker compose up -d
#
# Acionar DAG manualmente:
#   docker compose exec airflow-scheduler airflow dags trigger dag_etl_3w_pipeline

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.2
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-glue_user}:${POSTGRES_PASSWORD:-glue_password}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Dependencias instaladas automaticamente pelo entrypoint em todos os containers
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas>=2.1.0 numpy>=1.26.0 pyarrow>=14.0.0 boto3>=1.34.0 scikit-learn>=1.4.0 psycopg2-binary>=2.9.9"
    PROJECT_DIR: /opt/airflow/workspace
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    S3_BUCKET: ${S3_BUCKET:-3w-offshore-events}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-well_data}
    POSTGRES_USER: ${POSTGRES_USER:-glue_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glue_password}
    AWS_REGION: ${AWS_REGION:-us-east-1}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./scripts:/opt/airflow/workspace/scripts
    - ./config:/opt/airflow/workspace/config
    - ./data:/opt/airflow/workspace/data
    - ./docker/airflow-requirements.txt:/requirements.txt:ro
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - 3w-network
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ---------------------------------------------------------------------------
  # AWS Glue Local - Spark + PySpark
  # ---------------------------------------------------------------------------
  glue-local:
    image: public.ecr.aws/glue/aws-glue-libs:glue_libs_4.0.0_image_01
    container_name: glue-local-dev
    ports:
      - "4040:4040"
      - "18080:18080"
    volumes:
      - ./:/home/glue_user/workspace
      - ./data:/home/glue_user/workspace/data
    working_dir: /home/glue_user/workspace
    environment:
      - DISABLE_SSL=true
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - PROJECT_DIR=/home/glue_user/workspace
      - S3_BUCKET=${S3_BUCKET:-3w-offshore-events}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-well_data}
      - POSTGRES_USER=${POSTGRES_USER:-glue_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glue_password}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    networks:
      - 3w-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Jupyter - EDA e experimentacao (http://localhost:8888)
  # ---------------------------------------------------------------------------
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: 3w-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/workspace
    working_dir: /home/jovyan/workspace
    environment:
      - JUPYTER_ENABLE_LAB=no
      - CHOWN_HOME=yes
      - PROJECT_DIR=/home/jovyan/workspace
    command: >
      start-notebook.sh
      --NotebookApp.token=''
      --NotebookApp.password=''
      --NotebookApp.notebook_dir=/home/jovyan/workspace
      --ip=0.0.0.0
      --no-browser
    networks:
      - 3w-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL - backend do projeto e do Airflow (banco separado: airflow)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: 3w-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glue_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glue_password}
      POSTGRES_DB: ${POSTGRES_DB:-well_data}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
    networks:
      - 3w-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glue_user} -d ${POSTGRES_DB:-well_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # pgAdmin - http://localhost:5050  |  admin@3w.local / admin
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: 3w-pgadmin
    profiles: ["tools"]          # nao sobe com "docker compose up -d"
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@3w.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - 3w-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # MinIO - emulador S3  |  console: http://localhost:9001
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: 3w-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - 3w-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # mc-init - cria buckets no MinIO (container efemero)
  # ---------------------------------------------------------------------------
  mc-init:
    image: minio/mc:latest
    container_name: 3w-mc-init
    networks:
      - 3w-network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}
        mc mb --ignore-existing local/${S3_BUCKET:-3w-offshore-events}
        mc mb --ignore-existing local/${S3_BUCKET:-3w-offshore-events}/raw
        mc mb --ignore-existing local/${S3_BUCKET:-3w-offshore-events}/processed
        mc mb --ignore-existing local/${S3_BUCKET:-3w-offshore-events}/curated
        mc mb --ignore-existing local/${S3_BUCKET:-3w-offshore-events}/models
        mc mb --ignore-existing local/${S3_BUCKET:-3w-offshore-events}/results
        echo "Buckets criados com sucesso."
    restart: "no"

  # ---------------------------------------------------------------------------
  # airflow-db-init - garante que o banco "airflow" existe no PostgreSQL
  # Necessario quando o volume postgres ja existe (init_db.sql nao roda de novo)
  # ---------------------------------------------------------------------------
  airflow-db-init:
    image: postgres:15-alpine
    container_name: 3w-airflow-db-init
    networks:
      - 3w-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-glue_password}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Verificando banco 'airflow'..."
        psql -h postgres -U ${POSTGRES_USER:-glue_user} -d well_data \
          -tc "SELECT 1 FROM pg_database WHERE datname='airflow'" \
          | grep -q 1 || \
        psql -h postgres -U ${POSTGRES_USER:-glue_user} -d well_data \
          -c "CREATE DATABASE airflow"
        psql -h postgres -U ${POSTGRES_USER:-glue_user} -d well_data \
          -c "GRANT ALL PRIVILEGES ON DATABASE airflow TO ${POSTGRES_USER:-glue_user}"
        echo "Banco 'airflow' OK."
    restart: "no"

  # ---------------------------------------------------------------------------
  # Airflow Init - migra schema e cria usuario admin via entrypoint oficial
  # Usa _AIRFLOW_DB_MIGRATE e _AIRFLOW_WWW_USER_CREATE (compativel 2.x/2.9+)
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: 3w-airflow-init
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    command: version
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    restart: "no"

  # ---------------------------------------------------------------------------
  # Airflow Webserver - http://localhost:8080  |  admin / admin
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: 3w-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Streamlit - Dashboard interativo (http://localhost:8501)
  # ---------------------------------------------------------------------------
  streamlit:
    image: python:3.11-slim
    container_name: 3w-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - PROJECT_DIR=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-well_data}
      - POSTGRES_USER=${POSTGRES_USER:-glue_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glue_password}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    command: >
      bash -c "pip install --quiet streamlit pandas numpy pyarrow scikit-learn lightgbm xgboost plotly joblib &&
               streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true"
    networks:
      - 3w-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Airflow Scheduler - executa DAGs agendadas
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: 3w-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  3w-network:
    driver: bridge
    name: 3w-offshore-network

volumes:
  postgres_data:
    name: 3w-postgres-data
  pgadmin_data:
    name: 3w-pgadmin-data
  minio_data:
    name: 3w-minio-data
